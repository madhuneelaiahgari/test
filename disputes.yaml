classification:
  postHook: []
  strategy: combined
  fallback_class: unclassified
  combined:
    granularity: page
    page:
      contextPagesCount: 0
      system_prompt: >-
        You are a multimodal document classification expert that analyzes
        business documents using both visual layout and textual content. Your
        task is to classify single-page documents into predefined categories
        based on their structural patterns, visual features, and text content.
        Your output must be valid JSON according to the requested format.
        <variables> <document-ocr-data>: OCR-extracted text content from the
        document page that provides textual information for classification
        <document-image>: Visual representation of the document page that
        provides layout, formatting, and visual structure information
        <document-types>: List of valid document types with their descriptions
        that the document must be classified into </variables>
      task_prompt: >-
        <task-description> Analyze the provided document using both its visual
        layout and textual content to determine its document type and whether
        this page begins a new document or continues the previous one.
        </task-description>

        <document-types> {CLASS_NAMES_AND_DESCRIPTIONS} </document-types>

        <few-shot-examples> {FEW_SHOT_EXAMPLES} </few-shot-examples>

        <classification-instructions> Follow these steps to classify the
        document: 1. Examine the visual layout: headers, logos, formatting,
        structure, and visual organization 2. Analyze the textual content: key
        phrases, terminology, purpose, and information type 3. Identify
        distinctive features that match the document type descriptions 4. Decide
        the document_boundary by applying the <boundary-detection-rules> below
        5. Consider both visual and textual evidence together to determine the
        best match 6. CRITICAL: Only use document types explicitly listed in the
        <document-types> section </classification-instructions>

        <boundary-detection-rules> You are classifying ONE page at a time. Any
        pages shown to you as context are there only to help you judge this
        page; classify only the page identified as the page to classify.
        "document_boundary" answers one question: is this page the FIRST page of
        a document instance ("start"), or a later page of a document instance
        that already began on an earlier page ("continue")? Decide from this
        page's own evidence, in priority order: 1. PAGINATION: If the page shows
        pagination such as "Page 2 of 2", "Page 3 of 5", "2/2", or "continued"
        with a number greater than 1, this page is NOT a first page - output
        "continue". 2. If pagination indicates the first page (for example "Page
        1 of 2"), output "start". 3. OPENING HEADER BLOCK: A first page carries
        the document's opening identity block - the document title or form name,
        the issuer or institution name, the addressee or account holder name AND
        address, the statement or document date or period, and account or
        reference numbers. Output "start" ONLY when this page carries that
        opening block. 4. TABLE CONTINUATION: A page whose content is a table or
        list of rows - even when the table's COLUMN HEADINGS (for example "Date
        | Description | Amount") are repeated at the top of the page - and that
        does NOT carry the opening block is a continuation page. Repeated column
        headings are printed on every page of a long table; they are NOT a
        document title and do NOT make a page a first page. Output "continue"
        for such a page. 5. OTHER CONTINUATION EVIDENCE: A later page may also
        show a form number only in the footer, a running balance or subtotal
        carried forward, or a trailing signature/consent/certification section.
        Output "continue" for such a page. CRITICAL - no preceding page shown:
        If you are not shown the preceding page, do NOT conclude that this page
        must be a first page. Pages are classified independently, so the absence
        of a preceding page in your input tells you nothing about the document.
        Judge only from this page's own evidence: a page that shows only table
        rows, or is marked "Page 2 of 2", is a continuation page and must be
        "continue" even when you cannot see page 1. CRITICAL - consecutive
        documents of the same type: Output "start" whenever this page IS a first
        page (it carries the opening block), even when the preceding page has
        the same document type. Two copies of the same form filed back to back
        are two separate documents, and the first page of the second copy must
        be "start" so the two are not merged. PRECEDENCE: If the matched
        document type's description in <document-types> gives explicit boundary
        or page-ordering instructions (for example, how to handle pages scanned
        out of order), follow those instructions instead of the general rules
        above. If evidence is genuinely balanced, prefer "continue" for a page
        that lacks the opening block, and prefer "start" for a page that carries
        a complete opening block. </boundary-detection-rules>

        <output-format> {
          "classification_reason": "Detailed reasoning including specific visual and textual evidence that led to this classification, and which opening-block elements (title, issuer, addressee and address, date or period, account or reference number) this page does or does not carry",
          "class": "exact_document_type_from_list",
          "document_boundary": "start or continue"
        } </output-format>

        <<CACHEPOINT>>

        <document-ocr-data> {DOCUMENT_TEXT} </document-ocr-data>

        <final-instructions> Analyze the document above by: 1. Applying the
        <classification-instructions> to examine both visual and textual
        features 2. Selecting ONLY from document types in <document-types> 3.
        Providing clear reasoning with specific evidence 4. Outputting in the
        exact JSON format specified in <output-format> </final-instructions>
    packet:
      window_pages: '20'
      overlap_pages: '2'
      system_prompt: ''
      task_prompt: ''
    llm:
      model: us.anthropic.claude-sonnet-4-6
      model_lambda_hook_arn: null
      temperature: '0.0'
      top_p: '0.0'
      top_k: '5.0'
      reasoning_effort: medium
      max_tokens: null
      modality:
        text: null
        images: null
      image:
        target_width: null
        target_height: null
        dpi: null
        preprocessing: null
      validation:
        enforceValidClasses: true
        maxValidationRetries: '2'
      confidence:
        mode: topk
        top_k_candidates: '3'
        task_prompt_topk: >-
          <class-confidence> Your JSON object MUST also contain a "candidates"
          key: the {TOP_K_CANDIDATES} document types most likely to be correct
          for this page, most likely first, each with the probability that it is
          the correct type.

          "candidates": [
            {"class": "<most likely type>", "probability": <number between 0.0 and 1.0>},
            {"class": "<next most likely type>", "probability": <number between 0.0 and 1.0>}
          ]

          Rules: 1. Every "class" value must be one of the types listed in
          <document-types>. 2. The first candidate must be the same type you
          report in "class". 3. The probabilities must not sum to more than 1.0.
          Mass you leave unassigned means "possibly some other type". 4.
          Distribute the probability honestly. If a second type is genuinely
          plausible for this page, give it real probability mass instead of
          assigning close to 1.0 to the first — a page that is hard to classify
          should not look certain. </class-confidence>
        task_prompt_verbalized: >-
          <class-confidence> Your JSON object MUST also contain a "confidence"
          key: the probability, as a number between 0.0 and 1.0, that the type
          you report in "class" is correct for this page.

          Base it on how much better the page matches the type you chose than
          the other types in <document-types>. Do not default to a high value: a
          page whose evidence is thin or ambiguous should carry a low
          confidence. </class-confidence>
        task_prompt_topk_packet: ''
        task_prompt_verbalized_packet: ''
  split_then_classify:
    splitting:
      method: llm
      llm:
        model: us.anthropic.claude-sonnet-4-6
        model_lambda_hook_arn: null
        temperature: '0.0'
        top_p: '0.0'
        top_k: '5.0'
        reasoning_effort: medium
        max_tokens: null
        modality:
          text: null
          images: null
        image:
          target_width: null
          target_height: null
          dpi: null
          preprocessing: null
        granularity: page
        page:
          contextPagesCount: 0
          system_prompt: ''
          task_prompt: ''
        packet:
          window_pages: '20'
