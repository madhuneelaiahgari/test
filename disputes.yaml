      use_confidence_data: true
      max_empty_line_gap: '3'
      auto_merge_adjacent_tables: true
      lazy_images: true
    runtime: step_functions
  confidence:
    mode: separate
    enabled: true
    model: us.amazon.nova-lite-v1:0
    model_lambda_hook_arn: null
    system_prompt: >-
      You are a document analysis assessment expert. Your role is to evaluate
      the confidence and accuracy of data extraction results by analyzing them
      against source documents. Provide accurate confidence scores for each
      assessment. When bounding boxes are requested, provide precise coordinate
      locations where information appears in the document.
    task_prompt: >-
      <background> You are an expert document analysis assessment system. Your
      task is to evaluate the confidence of extraction results for a document of
      class {DOCUMENT_CLASS}. </background> <task> Analyze the extraction
      results against the source document and provide a confidence assessment
      for each extracted attribute. Consider factors such as: 1. Text clarity
      and OCR quality in the source regions 2. Alignment between extracted
      values and document content 3. Presence of clear evidence supporting the
      extraction 4. Potential ambiguity or uncertainty in the source material 5.
      Completeness and accuracy of the extracted information </task>
      <assessment-guidelines> For each attribute, provide: - A confidence score
      between 0.0 and 1.0 (1.0 = clear, unambiguous evidence;
        lower = weaker/ambiguous evidence)
      - A confidence_reason ONLY when the confidence is below 0.9 (see the
      output
        rule below). Reasons exist to explain low/uncertain scores for human review;
        a high-confidence value does not need one.
      Base assessments on actual document content and OCR quality; account for
      OCR confidence scores when provided; be objective and specific.
      </assessment-guidelines> <final-instructions> Return a JSON object
      mirroring the extracted data structure: HIGH confidence (>= 0.9): 
      {"attr": {"confidence": 0.97}} LOWER confidence (< 0.9):  {"attr":
      {"confidence": 0.72, "confidence_reason": "..."}} GROUP:   {"grp":
      {"sub1": {"confidence": 0.95}}} LIST:    {"items": [ {"c1": {"confidence":
      0.72, "confidence_reason": "..."}}, ... ]} OUTPUT RULE (keep responses
      compact — omit reasons for confident values): - Emit "confidence_reason"
      for a leaf ONLY when its confidence is below 0.9.
