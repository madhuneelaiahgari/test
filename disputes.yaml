      supporting_documents_present:
        items:
          type: string
        type: array
        x-aws-idp-evaluation-method: SEMANTIC
        x-aws-idp-list-item-description: One supporting document type present in the packet.
        description: >-
          List of supporting document types actually found in this packet (e.g.
          'bank_statement', 'credit_card_statement', 'receipt', 'invoice',
          'merchant_correspondence'). Include an entry only for a document
          actually present.
      evidence_summary:
        type: string
        x-aws-idp-evaluation-method: SEMANTIC
        description: >-
          A brief cross-document reconciliation note stating which supporting
          documents substantiate the dispute and what each establishes.
          Summarize only from documents actually present.
    $defs:
      DisputedTransaction:
        type: object
        description: One disputed merchandise transaction line.
        properties:
          merchant_or_description:
            description: Merchant/retailer name or description of the merchandise charge.
            type: string
            x-aws-idp-evaluation-method: SEMANTIC
          transaction_date:
            type: string
            x-aws-idp-evaluation-method: DATE
            description: Date the merchandise transaction occurred.
          amount:
            description: Amount of the disputed merchandise transaction, as it appears.
            type: string
            x-aws-idp-evaluation-method: NUMERIC_EXACT
          reason:
            description: >-
              Stated reason for disputing this merchandise charge (e.g. not
              received, damaged, wrong item, not as described).
            type: string
            x-aws-idp-evaluation-method: SEMANTIC
      Address:
        type: object
        description: The disputant's mailing address, if present.
        properties:
          Line1:
            x-aws-idp-evaluation-method: FUZZY
            description: Street address line.
            type: string
          City:
            x-aws-idp-evaluation-method: FUZZY
            type: string
            description: City.
          State:
            description: State or province (e.g. MO, CA).
            x-aws-idp-evaluation-method: EXACT
            type: string
          ZipCode:
            type: string
            x-aws-idp-evaluation-method: EXACT
            description: Postal / ZIP code.
  - description: >-
      A customer dispute specifically about a SERVICE or SUBSCRIPTION rather
      than a physical product. The disputant is complaining about something
      service-related — e.g. an UNAUTHORIZED recurring charge or subscription, a
      service NOT RENDERED or not performed, a CANCELLED service/subscription
      that is still being billed, a DUPLICATE service charge, a free trial that
      converted to a paid charge without consent, or poor/incomplete service
      quality. The document typically references a service provider or
      subscription name, a billing/service date or period, a
      subscription/membership ID, and a disputed amount. Choose this class (over
      the general Dispute-Case) whenever the dispute is clearly centered on a
      SERVICE/SUBSCRIPTION rather than a purchased physical product
      (Merchandise-Case).
    $schema: https://json-schema.org/draft/2020-12/schema
    $id: Service-Case
    x-aws-idp-document-type: Service-Case
    type: object
    required:
      - disputant_name
      - disputed_amount
      - dispute_reason
    properties:
      dispute_reason:
        x-aws-idp-evaluation-method: SEMANTIC
        description: >-
          The service-related reason for the dispute (e.g. unauthorized
          recurring/subscription charge, service not rendered, cancelled service
          still billed, duplicate service charge, free trial charged without
          consent, poor service quality).
        type: string
      case_or_reference_number:
        x-aws-idp-evaluation-method: EXACT
        description: >-
          Any dispute case ID, claim number, subscription/membership ID, or
          reference number associated with the service dispute, if present.
        type: string
      disputed_transactions:
        items:
          $ref: '#/$defs/DisputedTransaction'
        description: The individual service/subscription charges being disputed.
        x-aws-idp-evaluation-method: HUNGARIAN
        type: array
        x-aws-idp-evaluation-match-threshold: '0.8'
        x-aws-idp-list-item-description: One disputed service transaction.
      disputant_phone:
        type: string
        description: Contact phone number of the disputant.
        x-aws-idp-evaluation-method: EXACT
      account_number:
        x-aws-idp-evaluation-method: EXACT
        description: >-
          The account number associated with the dispute, as it appears in the
          document.
        type: string
      is_signed:
        x-aws-idp-evaluation-method: EXACT
        type: boolean
        description: True if the dispute letter/form appears to be signed.
      card_number:
        description: >-
          The credit/debit card number billed for the service, as it appears
          (may be full, masked, or last-4).
        type: string
        x-aws-idp-evaluation-method: EXACT
      authorization_denied:
        description: >-
          True if the disputant explicitly states they did NOT authorize the
          service/subscription charge (e.g. "I did not authorize this
          transaction").
        x-aws-idp-evaluation-method: EXACT
        type: boolean
      disputant_address:
        $ref: '#/$defs/Address'
        x-aws-idp-evaluation-method: LLM
        description: Mailing address of the disputant, if provided.
      disputed_amount:
        type: string
        description: The total amount being disputed for the service/subscription.
        x-aws-idp-evaluation-method: NUMERIC_EXACT
      requested_action:
        description: >-
          What the disputant is asking for (e.g. cancel the subscription,
          reverse the charge, refund, chargeback).
        x-aws-idp-evaluation-method: SEMANTIC
        type: string
      disputant_email:
        x-aws-idp-evaluation-method: EXACT
        description: Contact email of the disputant.
        type: string
      dispute_date:
        type: string
        x-aws-idp-evaluation-method: DATE
        description: Date the dispute was filed / the letter was written, if stated.
      disputant_name:
        description: >-
          Full name of the person filing the service dispute (the
          cardholder/account holder).
        type: string
        x-aws-idp-evaluation-method: EXACT
      statement_reference:
        type: string
        x-aws-idp-evaluation-method: EXACT
        description: >-
          Statement or credit-card-bill identifier/account reference from a bank
          statement or card statement included as supporting evidence. Null if
          no statement is present.
      statement_period:
        type: string
        x-aws-idp-evaluation-method: SEMANTIC
        description: >-
          The billing/statement period shown on a bank or credit-card statement
          in the packet (e.g. '01-31 August 2026'). Null if no statement is
          present.
      posting_date:
        type: string
        x-aws-idp-evaluation-method: DATE
        description: >-
          The posting/settlement date of the disputed charge as shown on the
          statement (distinct from the transaction date). Null if no statement
          is present.
      statement_confirms_charge:
        type: boolean
        x-aws-idp-evaluation-method: EXACT
        description: >-
          True if a bank or credit-card statement in the packet shows the
          disputed charge (same merchant and amount as the dispute). Set true
          only when a matching statement line is present.
      receipt_reference:
        type: string
        x-aws-idp-evaluation-method: EXACT
        description: >-
          The sales receipt reference / order number evidencing the original
          purchase. From a receipt in the packet. Null if no receipt is present.
      receipt_confirms_purchase:
        type: boolean
        x-aws-idp-evaluation-method: EXACT
        description: >-
          True if a sales receipt in the packet corroborates the disputed
          purchase (same provider and amount). Set true only when such a receipt
          is present.
      invoice_number:
        type: string
        x-aws-idp-evaluation-method: EXACT
        description: >-
          Invoice number from an invoice included as supporting evidence. Null
          if no invoice is present.
      invoice_total:
        type: string
        x-aws-idp-evaluation-method: NUMERIC_EXACT
        description: >-
          The total amount shown on a supporting invoice, as it appears. Null if
          no invoice is present.
      supporting_documents_present:
        items:
          type: string
        type: array
        x-aws-idp-evaluation-method: SEMANTIC
        x-aws-idp-list-item-description: One supporting document type present in the packet.
        description: >-
          List of supporting document types actually found in this packet (e.g.
          'bank_statement', 'credit_card_statement', 'receipt', 'invoice',
          'service_correspondence'). Include an entry only for a document
          actually present.
      evidence_summary:
        type: string
        x-aws-idp-evaluation-method: SEMANTIC
        description: >-
          A brief cross-document reconciliation note stating which supporting
          documents substantiate the dispute and what each establishes.
          Summarize only from documents actually present.
    $defs:
      DisputedTransaction:
        type: object
        description: One disputed service transaction line.
        properties:
          merchant_or_description:
            description: >-
              Service provider/subscription name or description of the service
              charge.
            type: string
            x-aws-idp-evaluation-method: SEMANTIC
          transaction_date:
            type: string
            x-aws-idp-evaluation-method: DATE
            description: Date the service was billed or performed.
          amount:
            description: Amount of the disputed service transaction, as it appears.
            type: string
            x-aws-idp-evaluation-method: NUMERIC_EXACT
          reason:
            description: >-
              Stated reason for disputing this service charge (e.g. unauthorized
              subscription, service not rendered, cancelled but still billed).
            type: string
            x-aws-idp-evaluation-method: SEMANTIC
      Address:
        type: object
        description: The disputant's mailing address, if present.
        properties:
          Line1:
            x-aws-idp-evaluation-method: FUZZY
            description: Street address line.
            type: string
          City:
            x-aws-idp-evaluation-method: FUZZY
            type: string
            description: City.
          State:
            description: State or province (e.g. MO, CA).
            x-aws-idp-evaluation-method: EXACT
            type: string
          ZipCode:
            type: string
            x-aws-idp-evaluation-method: EXACT
            description: Postal / ZIP code.
policy_classes: []
discovery:
  without_ground_truth:
    model_id: us.amazon.nova-pro-v1:0
    system_prompt: >-
      You are an expert in processing forms. Extracting data from images and
      documents. Analyze forms line by line to identify field names, data types,
      and organizational structure. Focus on creating comprehensive blueprints
      for document processing without extracting actual values.
    temperature: '0.0'
    top_p: '0.1'
    max_tokens: null
    user_prompt: >-
      This image contains forms data. Analyze the form line by line. Image may
      contain multiple pages, process all the pages. Form may contain multiple
      name value pair in one line. Extract all the names in the form including
      the name value pair which doesn't have value. Organize them into groups,
      extract field_name, data_type and field description. Field names should be
      less than 30 characters, use camelCase or snake_case, name should not
      start with number and name should not have special characters. Field
      descriptions should include location hints (box number, line number,
      section). Field_name should be unique within the group. Make sure to fill
      out the top-level "$id" and "x-aws-idp-document-type" with the extracted
      document class, and the top-level "description" with a brief description
      of the document class. Group the fields based on the section they are
      grouped in the form. Group should have attributeType as "group". Nesting
      Groups: Do not nest the groups i.e. groups within groups. All groups
      should be directly associated under main "properties". If the group
      repeats and follows table format, update the attributeType as "list". Do
      not extract the values. Return the extracted data in JSON format. Format
      the extracted data using the below JSON format: Format the extracted
      groups and fields using the below JSON format:
  with_ground_truth:
    model_id: us.amazon.nova-pro-v1:0
    system_prompt: >-
      You are an expert in processing forms. Extracting data from images and
      documents. Use provided ground truth data as reference to optimize field
      extraction and ensure consistency with expected document structure and
      field definitions.
    temperature: '0.0'
    top_p: '0.1'
    max_tokens: null
    user_prompt: >-
      This image contains unstructured data. Analyze the data line by line using
      the provided ground truth as reference. <GROUND_TRUTH_REFERENCE>
      {ground_truth_json} </GROUND_TRUTH_REFERENCE> Ground truth reference JSON
      has the fields we are interested in extracting from the document/image.
      Use the ground truth to optimize field extraction. Match field names, data
      types, and groupings from the reference. Image may contain multiple pages,
      process all pages. Extract all field names including those without values.
      Do not change the group name and field name from ground truth in the
      extracted data json. Add field_description field for every field which
      will contain instruction to LLM to extract the field data from the
      image/document. Add data_type field for every field. Make sure to fill out
      the top-level "$id" and "x-aws-idp-document-type" with the extracted
      document class, and the top-level "description" with a brief description
      of the document class. Nesting Groups: Do not nest the groups i.e. groups
      within groups. All groups should be directly associated under main
      "properties". If the group repeats and follows table format, update the
      attributeType as "list". Do not extract the values. Format the extracted
      data using the below JSON format: Format the extracted groups and fields
      using the below JSON format:
  auto_split:
    model_id: us.anthropic.claude-opus-4-6-v1:1m
    system_prompt: >-
      You are an expert document analyst. Your task is to identify distinct
      document sections within a multi-page document package. Return only valid
      JSON.
    temperature: '0.0'
    top_p: '0.1'
    max_tokens: null
    user_prompt: >-
      Analyze this multi-page document package. Identify the page boundaries
      where different document types or sections begin and end. For each
      distinct document section, provide: - "start": the first page number
      (1-based) - "end": the last page number (1-based) - "type": a short label
      for the document type (e.g., "W2 Form", "Letter", "Invoice") Return ONLY a
      JSON array, no other text: [{"start": 1, "end": 2, "type": "Letter"},
      {"start": 3, "end": 3, "type": "Invoice"}]
  multi_document:
    embedding_model_id: us.cohere.embed-v4:0
    analysis_model_id: us.anthropic.claude-sonnet-4-6
    temperature: '0.0'
    max_tokens: null
    max_documents: '500'
    min_cluster_size: '2'
    num_sample_documents: '3'
    max_sample_size: '5'
    max_concurrent_embeddings: '5'
    max_concurrent_clusters: '3'
    system_prompt: ''
  rules:
    model: global.anthropic.claude-sonnet-4-6
    system_prompt: >-
      You are an expert in analyzing policy documents and extracting business
      rules, regulations, and compliance requirements. Extract rules as
      structured, actionable validation statements.
    task_prompt: >-
      <background> You are an expert in regulatory document analysis. Your task
      is to extract ALL business rules, regulations, compliance requirements,
      and validation criteria from the attached policy document as a single flat
      list of rules. </background>

      <task> Analyze the policy document thoroughly, page by page. For each rule
      found:

      1. Give the rule a short, descriptive snake_case name (e.g.,
      "bundled_services_not_separate",
         "modifier_59_distinct_sites", "prior_auth_required")

      2. Write a clear, actionable description — phrased as a yes/no validation
      question
         or checkable statement

      3. Include specific codes, numbers, thresholds, or conditions mentioned

      4. Note any exceptions or special cases within the description

      5. Reference the page number or section where the rule was found </task>

      <extraction-guidelines> Guidelines: - Extract rules VERBATIM from the
      document where possible - Each rule should be a self-contained, evaluable
      statement - Rules should be specific enough to validate a transaction
      against - Do NOT classify or categorize the rules — output one flat list -
      Use descriptive snake_case names as rule identifiers (NOT generic
      "rule_1", "rule_2") - Each rule description should be phrased as a
      validation question or checkable statement - Do NOT interpret or infer
      rules not explicitly stated in the document - Process ALL pages of the
      document - If a rule has exceptions, include them in the description
      </extraction-guidelines>

      <output-format> Return ONLY a valid JSON array containing exactly ONE
      object. All rules go into a single "rule_properties" dict with descriptive
      snake_case keys:

      [
          {
              "x-aws-idp-rule-type": "policy_rules",
              "description": "All rules extracted from the policy document",
              "rule_properties": {
                  "bundled_services_not_separate": {
                      "description": "Are bundled services (exploration, lysis of adhesions, closure, anesthesia) NOT reported separately from the primary surgical procedure?",
                      "page": "V-5"
                  },
                  "modifier_59_distinct_sites": {
                      "description": "Is modifier 59 used only when procedures are performed at distinctly different anatomic sites or during separate patient encounters?",
                      "page": "V-8"
                  },
                  "prior_auth_required": {
                      "description": "Has prior authorization been obtained before performing procedures that require pre-approval per the policy?",
                      "page": "III-4"
                  },
                  "medical_necessity_documented": {
                      "description": "Is medical necessity documentation included to support the procedure performed?",
                      "page": "IV-1"
                  }
              }
          }
      ] </output-format>

      <final-instructions> Extract rules from the attached policy document by:
      1. Reading every page systematically to identify all stated rules 2.
      Giving each rule a short, descriptive snake_case name 3. Phrasing each
      rule as a yes/no validation question 4. Including page references for
      traceability 5. Placing ALL rules into a single "rule_properties" object
      under one wrapper 6. Do NOT include any text outside the JSON array -
      return ONLY valid JSON </final-instructions>
    temperature: '0.0'
    top_p: '0.0'
    top_k: '5.0'
    max_tokens: null
    agentic:
      enabled: false
      review_agent: false
      review_agent_model: global.anthropic.claude-sonnet-4-6
evaluation:
  enabled: true
  llm_method:
    top_p: '0.0'
    max_tokens: null
    top_k: '5.0'
    reasoning_effort: medium
    task_prompt: >-
      I need to evaluate attribute extraction for a document of class:
      {DOCUMENT_CLASS}. For the attribute named "{ATTRIBUTE_NAME}" described as
      "{ATTRIBUTE_DESCRIPTION}": - Expected value: {EXPECTED_VALUE} - Actual
      value: {ACTUAL_VALUE} Do these values match in meaning, taking into
      account formatting differences, word order, abbreviations, and semantic
      equivalence? Provide your assessment as a JSON with three fields: -
      "match": boolean (true if they match, false if not) - "score": number
      between 0 and 1 representing the confidence/similarity score - "reason":
      brief explanation of your decision Respond ONLY with the JSON and nothing
      else. Here's the exact format: {
        "match": true or false,
        "score": 0.0 to 1.0,
        "reason": "Your explanation here"
      }
    temperature: '0.0'
    model: us.anthropic.claude-sonnet-4-6
    system_prompt: >-
      You are an evaluator that helps determine if the predicted and expected
      values match for document attribute extraction. You will consider the
      context and meaning rather than just exact string matching.
