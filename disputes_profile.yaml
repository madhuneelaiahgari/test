    system_prompt: >-
      You are an intelligent error analysis agent for the GenAI IDP (Intelligent
      Document Processing) system with access to specialized diagnostic tools.


      SYSTEM ARCHITECTURE:

      The GenAI IDP system processes documents through an AWS Step Functions
      state machine with the following pipeline stages:

      - OCR Stage: Extracts text/layout from documents using Amazon Textract or
      Amazon Bedrock Data Automation (BDA)

      - Classification Stage: Identifies the document class using a Bedrock LLM

      - Extraction Stage: Extracts structured fields using a Bedrock LLM based
      on class-specific configuration

      - Assessment Stage: Evaluates extraction quality using a Bedrock LLM

      - Summarization Stage (optional): Generates a document summary

      - Evaluation Stage (optional): Scores extraction accuracy against ground
      truth


      BDA Alternative Branch:

      - InvokeBDA → BDA Completion (EventBridge-triggered) → BDA ProcessResults

      - BDA jobs are asynchronous; failures may appear in EventBridge delivery
      or the BDA service itself


      Key AWS services involved:

      - AWS Step Functions: Orchestrates the pipeline workflow

      - AWS Lambda: Executes each stage as an independent function

      - Amazon DynamoDB: Tracks document status and metadata per stage

      - Amazon CloudWatch: Captures logs from each Lambda function

      - AWS X-Ray: Provides distributed tracing across Lambda and Bedrock calls

      - Amazon Bedrock: Provides LLM inference for classification, extraction,
      assessment, and summarization

      - Amazon Textract: Performs OCR for non-BDA documents

      - Amazon S3: Stores input documents, OCR results, and extracted output


      INVESTIGATION WORKFLOW:

      1. Identify the document status in DynamoDB to understand which pipeline
      stage failed

      2. Retrieve Step Functions execution details to get the execution timeline
      and error event

      3. Collect CloudWatch logs from the failing Lambda stage for detailed
      error messages

      4. Use X-Ray traces to identify performance bottlenecks or cascading
      failures across services

      5. Synthesize all evidence to determine root cause — never stop at the
      first error message


      TOOL USAGE:

      - Document-specific analysis (user provides a filename or document ID):
        → Use cloudwatch_document_logs and dynamodb_status as primary tools
      - System-wide or batch analysis (no specific document):
        → Use cloudwatch_logs and dynamodb_query to identify patterns
      - Workflow failures and execution timeline:
        → Use stepfunction_details for the execution event history
      - Lambda configuration and environment context:
        → Use lambda_lookup to check timeout settings, memory, and environment variables
      - Which Bedrock model a pipeline stage uses (e.g. after a model error):
        → Use fetch_pipeline_configuration with the document's config version to read the per-stage model IDs
      - Distributed service interaction issues:
        → Use xray_trace or xray_performance_analysis

      Always use at least 2 different tool sources before concluding a root
      cause. If a tool call returns no useful data, try an alternative — never
      guess without evidence.


      CRITICAL — DRILL INTO THE FAILING STAGE'S OWN LOGS:

      The Step Functions error and the DynamoDB status_reason usually show a

      GENERIC WRAPPER message (e.g. "Summarization failed for document X.pdf",

      "Extraction failed"), because each stage Lambda catches the underlying

      exception and re-raises a stage-level summary. That wrapper is a SYMPTOM,

      not the root cause. You MUST fetch the CloudWatch logs of the specific

      Lambda function for the failing stage and read the FIRST underlying

      exception/traceback it logged (e.g. a Bedrock ResourceNotFoundException,

      ThrottlingException, ValidationException, or a Python traceback). Search

      that stage's log group by the failing Lambda's request ID (from the

      Step Functions error cause or the X-Ray trace) with an "ERROR" filter, and

      quote the earliest real error — not the last wrapper line. If the wrapper

      message names a stage, the log group you need is that stage's function

      (e.g. SummarizationFunction, ExtractionFunction, AssessmentFunction).


      DO NOT CONFLATE UNRELATED NON-FATAL ISSUES WITH THE FAILURE:

      A document's DynamoDB record may carry `ProcessingIssue` entries with

      severity "warning" or non-terminal notes (e.g. an `assessment_incomplete`

      row that self-healed or was recorded but did not stop the pipeline). These

      are NOT necessarily the cause of a FAILED workflow. Before attributing the

      failure to a ProcessingIssue, confirm it occurred in the SAME stage that

      Step Functions reports as the failure point AND that its severity is

      "error". If the failing stage differs from the stage that logged the

      ProcessingIssue, treat the ProcessingIssue as context, not root cause, and

      keep drilling into the failing stage's logs.


      INVESTIGATION STRATEGY:

      Use this approach for all investigations, whether a single document or a
      large batch:


      1. TRIAGE: Check DynamoDB for document status and which stage failed. For
      batches, get a count of failed documents and their error status
      distribution.


      2. SAMPLE: For multiple failures, select 2-3 representative failed
      documents. Avoid over-sampling — additional documents yield diminishing
      returns.


      3. TRACE THE CAUSAL CHAIN for each sampled document:
         DynamoDB status → Step Functions execution timeline → CloudWatch error logs → X-Ray traces

      4. APPLY THE "5 WHYS" — Never stop at the first error. Keep asking "what
      caused THIS?":
         Finding: "Extraction Lambda timed out" → Why?
         "Lambda waited 14 minutes on Bedrock InvokeModel" → Why was it slow?
         "Bedrock returned ThrottlingException, triggering exponential backoff" → Why throttled?
         "Batch of 200 docs with extraction concurrency=10 exceeded Bedrock RPM quota"
         ROOT CAUSE: "Extraction concurrency too high for the configured Bedrock account quota"

      5. DISTINGUISH SYSTEMIC vs ISOLATED FAILURES:
         - Same error type across many documents → systemic issue (quota, permissions, configuration, service limit)
         - Different errors across documents → per-document issues (bad input, edge cases, unsupported format)

      6. VALIDATE: Does the identified root cause explain ALL observed failures?


      ROOT CAUSE vs SYMPTOM GUIDE:

      - SYMPTOM: "Document processing failed"

      - SYMPTOM: "Extraction Lambda returned error"

      - CLOSER:  "ThrottlingException from Bedrock InvokeModel"

      - ROOT CAUSE: "Bedrock RPM quota exceeded — batch concurrency generated
      too many concurrent API calls"


      - SYMPTOM: "Classification failed"

      - CLOSER:  "Textract API timeout"

      - ROOT CAUSE: "150-page PDF exceeded Textract async processing limit for
      the configured region"


      COMMON ERROR PATTERNS:

      Use these patterns to guide your investigation and accelerate diagnosis:


      1. THROTTLING — ThrottlingException, TooManyRequestsException, "Rate
      exceeded", "Too many requests"
         Likely cause: Batch size × concurrency > Bedrock RPM/TPM quota, or Textract TPS limit exceeded
         Check: Concurrent Lambda executions, batch size, Bedrock model quotas

      2. TIMEOUT — "Task timed out", "Lambda timeout", "socket timeout",
      "Connection reset"
         Likely cause: Large document (many pages), undersized Lambda timeout or memory, slow Bedrock inference
         Check: Document page count, Lambda timeout configuration, model response latency in X-Ray

      3. CONFIGURATION ERROR — KeyError, missing field, "not found in config",
      validation error, AttributeError
         Likely cause: Class definition or attribute names in config don't match expected schema; config changes deployed incorrectly
         Check: DynamoDB config table, class definitions, attribute names for the affected document class

      4. PERMISSIONS — AccessDeniedException, "not authorized", "is not
      authorized to perform", ExpiredToken
         Likely cause: Missing IAM policy, cross-account access issue, Bedrock model access not granted, KMS policy gap
         Check: Lambda execution role policies, Bedrock model access in the console, S3 bucket policies

      5. INPUT QUALITY — empty extraction results, very low confidence, "unable
      to parse", Textract errors on specific pages
         Likely cause: Poor scan quality, handwritten content, unsupported file format, corrupted PDF
         Check: OCR output in S3, original document quality, Textract response for page-level errors

      6. BDA-SPECIFIC — "BDA Job Failed", blueprint mismatch, async job timeout,
      missing EventBridge event
         Likely cause: Blueprint schema mismatch with document type, BDA service limit, EventBridge delivery failure
         Check: BDA project configuration, blueprint compatibility, EventBridge rule and DLQ

      7. BEDROCK MODEL ERRORS — ModelErrorException, "model returned an error",
      context length exceeded
         Likely cause: Document content too large for model context window, model unavailable in region, prompt issue
         Check: Document page count, OCR text length, model availability, extraction prompt configuration

      8. RETIRED / UNAVAILABLE MODEL — ResourceNotFoundException, "This model
      version has reached the end of its life", "model identifier is invalid",
      "could not be found"
         Likely cause: The model ID configured for a stage (OCR/classification/extraction/assessment/summarization) has been retired (end-of-life) by Bedrock, or is not enabled/available in this account/region
         Check: The Bedrock error does NOT name the model. To identify it, call fetch_pipeline_configuration with the document's config version (the ConfigVersion field from fetch_document_record) and read the model configured for the FAILING stage (match the stage to the failing Lambda — e.g. the "summarization" stage for SummarizationFunction). Name that exact model ID as the root cause and recommend switching that stage to a currently-supported model in the UI Configuration panel — do NOT just tell the user to "confirm the configured model".

      OUTPUT FORMAT:

      Always format your response with exactly these three sections in this
      order:


      ## Root Cause

      **Confidence:** [HIGH | MEDIUM | LOW]

      Identify the specific underlying technical reason why the error occurred.
      Focus on the primary cause, not symptoms.


      ## Recommendations

      Provide specific, actionable steps to resolve the issue. Limit to top
      three recommendations only.


      <details>

      <summary><strong>Evidence</strong></summary>


      Format evidence with source information. Include relevant data from tool
      responses:


      **For CloudWatch logs:**

      **Log Group:** [full log_group name]

      **Log Stream:** [full log_stream name]

      ```

      [ERROR] timestamp message

      ```


      **For other sources (DynamoDB, Step Functions, X-Ray):**

      **Source:** [service name and resource]

      ```

      Relevant data from tool response

      ```


      </details>


      FORMATTING RULES:

      - Use the exact three-section structure above

      - Add Confidence (HIGH/MEDIUM/LOW) as the first line of the Root Cause
      section

      - Make the Evidence section collapsible using HTML details tags

      - Include relevant data from all tool responses used

      - For CloudWatch: Show complete log group and log stream names without
      truncation

      - Present evidence data in code blocks with appropriate source labels


      RECOMMENDATION GUIDELINES:

      For code-related issues or system bugs:

      - Do not suggest code modifications — users cannot change Lambda code

      - Describe the error in detail with timestamps and context so it can be
      reported


      For configuration-related issues:

      - Direct users to the UI configuration panel

      - Specify the exact configuration section and parameter name


      For operational issues (throttling, timeouts, quotas):

      - Provide immediate remediation steps (e.g., reduce concurrency, reprocess
      failed documents)

      - Include preventive measures to avoid recurrence


      COMMON MISTAKES TO AVOID:

      - Do NOT report "Lambda function returned error" as a root cause — that is
      a symptom

      - Do NOT recommend "check CloudWatch logs" as a recommendation — you are
      already doing that

      - Do NOT suggest code changes — users cannot modify Lambda functions

      - Do NOT speculate about root cause without corroborating tool evidence

      - Do NOT investigate more than 3 sample documents in a batch — focus on
      pattern recognition

      - Do NOT include search quality reflections, meta-analysis, or sections
      not listed in the output format above
    parameters:
      max_log_events: '10'
      time_range_hours_default: '24'
      max_log_message_length: '400'
      max_events_per_log_group: '5'
      max_log_groups: '20'
      max_stepfunction_timeline_events: '50'
      max_stepfunction_error_length: '400'
      max_stepfunction_history_pages: '10'
      xray_slow_segment_threshold_ms: '5000'
      xray_error_rate_threshold: '0.05'
      xray_response_time_threshold_ms: '10000'
      xray_analysis_hours: '3'
      settings_cache_ttl_seconds: '300'
classes:
  - $schema: https://json-schema.org/draft/2020-12/schema
    $id: Customer-Change-Request
    x-aws-idp-document-type: Customer-Change-Request
    type: object
    description: >-
      A letter, note or form written by an account holder to the bank asking for
      their personal details on the account to be updated: a change of name,
      mailing address and/or phone number. Usually handwritten or typed in the
      first person, opening with a greeting such as 'Hi', 'Hello' or 'To
      Barclays', containing phrases like 'please update', 'change my name', 'my
      new address', 'current name on the account', and often a sign-off with the
      customer's name, a card ending or an address. It often refers to an
      enclosed proof document. This is NOT the proof document itself: a marriage
      certificate, divorce decree, court name-change order or naturalization
      certificate is an official government or court record, printed on a formal
      template with seals, case or registration numbers and an official
      signature.
    required:
      - requested_change_types
      - customer_signed_name
    properties:
      requested_change_types:
        type: array
        description: >-
          Every type of change the customer asks for. Use only these values:
          NAME, ADDRESS, PHONE. Include NAME only if the customer asks to change
          their name, ADDRESS only if they ask to change their address, PHONE
          only if they ask to change their phone number. A contact address
          written below the signature is NOT a request to change the address
          unless the letter says it is new or asks for it to be updated.
        items:
          type: string
          enum:
            - NAME
            - ADDRESS
            - PHONE
        x-aws-idp-evaluation-method: HUNGARIAN
        x-aws-idp-list-item-description: One requested change type.
      current_name_on_account:
        type: string
        description: >-
          The name the account is currently held under, e.g. after 'current
          name', 'my account is currently under the name', or on the left of an
          arrow (old → new). This is NOT the new name.
        x-aws-idp-evaluation-method: FUZZY
      new_name_requested:
        type: string
        description: >-
          The new name the customer wants on the account, e.g. after 'change
          to', 'my new name is', 'my legal name has now changed to', or on the
          right of an arrow. Leave empty if no name change is requested.
        x-aws-idp-evaluation-method: FUZZY
      name_change_reason:
        type: string
        description: >-
          Why the name changed, as stated by the customer, e.g. marriage,
          divorce, naturalization, court order. Leave empty if not stated.
        x-aws-idp-evaluation-method: SEMANTIC
      current_address:
        type: object
        description: >-
          The customer's existing address on the account, only if the letter
          explicitly says it is the old or current address. This is NOT the new
          address.
        properties:
          street:
            type: string
            description: Street number and street name, plus any apartment or unit.
            x-aws-idp-evaluation-method: EXACT
          city:
            type: string
            description: City or town.
            x-aws-idp-evaluation-method: EXACT
          state:
            type: string
            description: State as written, e.g. CA, NV.
            x-aws-idp-evaluation-method: EXACT
          postal_code:
            type: string
            description: ZIP or postal code, exactly as written.
            x-aws-idp-evaluation-method: EXACT
      new_address:
        type: object
        description: >-
          The new address the customer wants on the account, only if they ask
          for an address change (e.g. 'I have moved', 'my new address is'). If
          an address appears only in the sign-off with no request to change it,
          leave this empty and put it in contact_address_provided.
        properties:
          street:
            type: string
            description: Street number and street name, plus any apartment or unit.
            x-aws-idp-evaluation-method: EXACT
          city:
            type: string
            description: City or town.
            x-aws-idp-evaluation-method: EXACT
          state:
            type: string
            description: State as written, e.g. CA, NV.
            x-aws-idp-evaluation-method: EXACT
          postal_code:
            type: string
            description: ZIP or postal code, exactly as written.
            x-aws-idp-evaluation-method: EXACT
      contact_address_provided:
        type: object
        description: >-
          Any address written in the sign-off or signature block of the letter,
          whether or not a change is requested.
        properties:
          street:
            type: string
            description: Street number and street name, plus any apartment or unit.
            x-aws-idp-evaluation-method: EXACT
          city:
            type: string
            description: City or town.
            x-aws-idp-evaluation-method: EXACT
          state:
            type: string
            description: State as written, e.g. CA, NV.
            x-aws-idp-evaluation-method: EXACT
          postal_code:
            type: string
            description: ZIP or postal code, exactly as written.
            x-aws-idp-evaluation-method: EXACT
      current_phone_number:
        type: string
        description: >-
          The existing phone number on the account, only if the letter says it
          is the old or current number.
        x-aws-idp-evaluation-method: EXACT
      new_phone_number:
        type: string
        description: >-
          The new phone number the customer wants on the account, only if a
          phone change is requested. This is NOT a number that appears without
          any request to change it.
        x-aws-idp-evaluation-method: EXACT
      card_or_account_last_digits:
        type: string
        description: >-
          Last digits of the card or account the customer quotes, e.g. after
          'card ending', 'account ending'. Digits only.
        x-aws-idp-evaluation-method: EXACT
      supporting_documents_referenced:
        type: array
        description: >-
          Proof documents the customer says are enclosed or attached, e.g.
          marriage certificate, divorce papers, court order, certificate of
          naturalization, utility bill.
        items:
          type: string
        x-aws-idp-evaluation-method: HUNGARIAN
        x-aws-idp-list-item-description: One referenced supporting document.
      customer_signed_name:
        type: string
        description: The name the customer signs off with at the end of the letter.
        x-aws-idp-evaluation-method: FUZZY
  - $schema: https://json-schema.org/draft/2020-12/schema
    $id: Marriage-Certificate
    x-aws-idp-document-type: Marriage-Certificate
    type: object
    description: >-
      An official certificate issued by a state or county vital records office
      recording a marriage. Printed on a formal template titled 'Certificate of
      Marriage', with spouse data blocks (full name, date of birth, new last
      name adopted), a registration number, an officiant signature and an
      official seal. This is NOT a Divorce-Decree (which dissolves a marriage
      and is issued by a court) and NOT a customer letter.
    required:
      - spouse_1_full_name
      - marriage_date
    properties:
      registration_number:
        type: string
        description: >-
          Local registration or certificate number, e.g. 'LOCAL REGISTRATION
          NUMBER'.
        x-aws-idp-evaluation-method: EXACT
      issuing_authority:
        type: string
        description: State and department that issued the certificate, from the header.
        x-aws-idp-evaluation-method: EXACT
      spouse_1_full_name:
        type: string
        description: >-
          Full name (first, middle, last) in the FIRST SPOUSE DATA block, before
          the marriage.
        x-aws-idp-evaluation-method: FUZZY
      spouse_1_date_of_birth:
        type: string
        description: Date of birth in the first spouse block, as written.
        x-aws-idp-evaluation-method: EXACT
      spouse_1_new_last_name:
        type: string
        description: '''New last name adopted'' for the first spouse.'
        x-aws-idp-evaluation-method: EXACT
      spouse_2_full_name:
        type: string
        description: Full name in the SECOND SPOUSE DATA block.
        x-aws-idp-evaluation-method: FUZZY
      spouse_2_date_of_birth:
        type: string
        description: Date of birth in the second spouse block.
        x-aws-idp-evaluation-method: EXACT
      spouse_2_new_last_name:
        type: string
        description: '''New last name adopted'' for the second spouse.'
        x-aws-idp-evaluation-method: EXACT
      marriage_date:
        type: string
        description: Date the marriage took place, from the certification text.
        x-aws-idp-evaluation-method: EXACT
      marriage_location:
        type: string
        description: City and state where the marriage took place.
        x-aws-idp-evaluation-method: FUZZY
      officiant_name:
        type: string
        description: Name next to 'Officiant signature'.
        x-aws-idp-evaluation-method: FUZZY
  - $schema: https://json-schema.org/draft/2020-12/schema
    $id: Divorce-Decree
    x-aws-idp-document-type: Divorce-Decree
    type: object
    description: >-
      A court decree, usually from a family court, dissolving a marriage. Titled
      e.g. 'Decree of Dissolution of Marriage', with a case number, petitioner
      and respondent names, ordered paragraphs ('IT IS HEREBY ORDERED, ADJUDGED
      AND DECREED') and a judge's signature and court stamp. It may include a
      'Restoration of Former Name' clause. This is NOT a
      Name-Change-Court-Order, whose sole purpose is changing a name rather than
      ending a marriage, and NOT a Marriage-Certificate.
    required:
      - case_number
      - petitioner_name
    properties:
      court_name:
        type: string
        description: Name of the court and county/state from the header.
        x-aws-idp-evaluation-method: FUZZY
      case_number:
        type: string
        description: Case number, e.g. after 'CASE NO:'.
        x-aws-idp-evaluation-method: EXACT
      petitioner_name:
        type: string
        description: Name of the petitioner, labelled 'Petitioner'.
        x-aws-idp-evaluation-method: FUZZY
      respondent_name:
        type: string
        description: Name of the respondent, labelled 'Respondent'.
        x-aws-idp-evaluation-method: FUZZY
      name_restored:
        type: boolean
        description: True if the decree restores a former or maiden name to a party.
        x-aws-idp-evaluation-method: EXACT
      restored_name:
        type: string
        description: >-
          The full legal name the party is authorized to resume, from the
          'Restoration of former name' clause. Leave empty if none.
        x-aws-idp-evaluation-method: FUZZY
      decree_date:
        type: string
        description: Date the decree was entered or filed, from the court stamp or text.
        x-aws-idp-evaluation-method: EXACT
      judge_name:
        type: string
        description: Name of the judge who signed the decree.
        x-aws-idp-evaluation-method: FUZZY
  - $schema: https://json-schema.org/draft/2020-12/schema
    $id: Name-Change-Court-Order
    x-aws-idp-document-type: Name-Change-Court-Order
    type: object
    description: >-
      A court decree granting an individual's petition to change their legal
      name. Titled e.g. 'Decree for Change of Name', 'In the matter of the
      application of … for change of name to …', with a case number, a hearing
      date, findings, an order that the name 'is hereby changed from X to Y', a
      court seal and a judge's signature. This is NOT a Divorce-Decree (which
      ends a marriage) and NOT a Certificate-of-Naturalization (issued by USCIS
      for citizenship).
    required:
      - case_number
      - former_name
      - new_name
    properties:
      court_name:
        type: string
        description: Court name and county/state from the header.
        x-aws-idp-evaluation-method: FUZZY
      case_number:
        type: string
        description: Case number, e.g. after 'CASE NO:'.
        x-aws-idp-evaluation-method: EXACT
      former_name:
        type: string
        description: The petitioner's legal name before the change ('changed from …').
        x-aws-idp-evaluation-method: FUZZY
      new_name:
        type: string
        description: The legal name granted by the order ('changed … to …').
        x-aws-idp-evaluation-method: FUZZY
      petitioner_address:
        type: object
        description: Residential address of the petitioner stated in the court findings.
        properties:
          street:
            type: string
            description: Street number and street name, plus any apartment or unit.
            x-aws-idp-evaluation-method: EXACT
          city:
            type: string
            description: City or town.
            x-aws-idp-evaluation-method: EXACT
          state:
            type: string
            description: State as written, e.g. CA, NV.
            x-aws-idp-evaluation-method: EXACT
          postal_code:
            type: string
            description: ZIP or postal code, exactly as written.
            x-aws-idp-evaluation-method: EXACT
      hearing_date:
        type: string
        description: Date of the hearing.
        x-aws-idp-evaluation-method: EXACT
      filed_date:
        type: string
        description: Date the order was filed or recorded, from the court seal.
        x-aws-idp-evaluation-method: EXACT
      judge_name:
        type: string
        description: Name of the judge who signed the order.
        x-aws-idp-evaluation-method: FUZZY
  - $schema: https://json-schema.org/draft/2020-12/schema
    $id: Certificate-of-Naturalization
    x-aws-idp-document-type: Certificate-of-Naturalization
    type: object
    description: >-
      A U.S. government certificate issued by USCIS confirming a person became a
      U.S. citizen. Titled 'Certificate of Naturalization', with a USCIS
      registration number (A-number), a certificate number, the holder's
      original name, any new legal name declared, date of birth, country of
      former allegiance, a holder photo and the USCIS director's signature. This
      is NOT a court Name-Change-Court-Order and NOT a customer letter.
    required:
      - certificate_number
      - original_name
    properties:
      uscis_registration_number:
        type: string
        description: USCIS registration number (A-number), e.g. 'A-0xx-xxx-xxx'.
        x-aws-idp-evaluation-method: EXACT
      certificate_number:
        type: string
        description: Certificate number, e.g. after 'CERTIFICATE NO:'.
        x-aws-idp-evaluation-method: EXACT
      original_name:
        type: string
        description: Value after 'ORIGINAL NAME'.
        x-aws-idp-evaluation-method: FUZZY
      new_legal_name_declared:
        type: string
        description: Value after 'NEW LEGAL NAME DECLARED'. Leave empty if not present.
        x-aws-idp-evaluation-method: FUZZY
      date_of_birth:
        type: string
        description: Holder's date of birth.
        x-aws-idp-evaluation-method: EXACT
      naturalization_date:
        type: string
        description: Date of the ceremony or determination.
        x-aws-idp-evaluation-method: EXACT
      naturalization_location:
        type: string
        description: City and state where naturalization took place.
        x-aws-idp-evaluation-method: FUZZY
policy_classes: []
discovery:
  without_ground_truth:
    model_id: us.amazon.nova-pro-v1:0
    system_prompt: >-
      You are an expert in processing forms. Extracting data from images and
