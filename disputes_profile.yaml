config_format_version: '0.10'
use_bda: false
enable_blueprint_optimization: false
managed: false
test_set: null
notes: >-
  Lending package sample - processes payslips, driver licenses, bank checks,
  bank statements, W2s, and insurance applications - . Set use_bda: true for BDA
  mode.
malware_scanning:
  on_unscannable: block
  alert_on_block: true
preprocessing:
  enabled: false
  arn: null
  onError: continue
  args: []
  featureId: ''
  allowDocumentUpdate: true
ocr:
  postHook: []
  backend: textract
  bda_project_arn: null
  model_id: us.amazon.nova-2-lite-v1:0
  model_lambda_hook_arn: null
  system_prompt: >-
    You are an expert OCR system. Extract all text from the provided image
    accurately, preserving layout where possible.
  task_prompt: >-
    Extract all text from this document image. Preserve the layout, including
    paragraphs, tables, and formatting.
  reasoning_effort: medium
  features:
    - name: TABLES
    - name: LAYOUT
    - name: SIGNATURES
  max_workers: '20'
  image:
    target_width: null
    target_height: null
    dpi: null
    preprocessing: null
classification:
  postHook: []
  strategy: combined
  fallback_class: unclassified
  combined:
    granularity: page
    page:
      contextPagesCount: 0
      system_prompt: >-
        You are a multimodal document classification expert that analyzes
        business documents using both visual layout and textual content. Your
        task is to classify single-page documents into predefined categories
        based on their structural patterns, visual features, and text content.
        Your output must be valid JSON according to the requested format.
        <variables> <document-ocr-data>: OCR-extracted text content from the
        document page that provides textual information for classification
        <document-image>: Visual representation of the document page that
        provides layout, formatting, and visual structure information
        <document-types>: List of valid document types with their descriptions
        that the document must be classified into </variables>
      task_prompt: >-
        <task-description> Analyze the provided document using both its visual
        layout and textual content to determine its document type and whether
        this page begins a new document or continues the previous one.
        </task-description>

        <document-types> {CLASS_NAMES_AND_DESCRIPTIONS} </document-types>

        <few-shot-examples> {FEW_SHOT_EXAMPLES} </few-shot-examples>

        <classification-instructions> Follow these steps to classify the
        document: 1. Examine the visual layout: headers, logos, formatting,
        structure, and visual organization 2. Analyze the textual content: key
        phrases, terminology, purpose, and information type 3. Identify
        distinctive features that match the document type descriptions 4. Decide
        the document_boundary by applying the <boundary-detection-rules> below
        5. Consider both visual and textual evidence together to determine the
        best match 6. CRITICAL: Only use document types explicitly listed in the
        <document-types> section </classification-instructions>

        <boundary-detection-rules> You are classifying ONE page at a time. Any
        pages shown to you as context are there only to help you judge this
        page; classify only the page identified as the page to classify.
        "document_boundary" answers one question: is this page the FIRST page of
        a document instance ("start"), or a later page of a document instance
        that already began on an earlier page ("continue")? Decide from this
        page's own evidence, in priority order: 1. PAGINATION: If the page shows
        pagination such as "Page 2 of 2", "Page 3 of 5", "2/2", or "continued"
        with a number greater than 1, this page is NOT a first page - output
        "continue". 2. If pagination indicates the first page (for example "Page
        1 of 2"), output "start". 3. OPENING HEADER BLOCK: A first page carries
        the document's opening identity block - the document title or form name,
        the issuer or institution name, the addressee or account holder name AND
        address, the statement or document date or period, and account or
        reference numbers. Output "start" ONLY when this page carries that
        opening block. 4. TABLE CONTINUATION: A page whose content is a table or
        list of rows - even when the table's COLUMN HEADINGS (for example "Date
        | Description | Amount") are repeated at the top of the page - and that
        does NOT carry the opening block is a continuation page. Repeated column
        headings are printed on every page of a long table; they are NOT a
        document title and do NOT make a page a first page. Output "continue"
        for such a page. 5. OTHER CONTINUATION EVIDENCE: A later page may also
        show a form number only in the footer, a running balance or subtotal
        carried forward, or a trailing signature/consent/certification section.
        Output "continue" for such a page. CRITICAL - no preceding page shown:
        If you are not shown the preceding page, do NOT conclude that this page
        must be a first page. Pages are classified independently, so the absence
        of a preceding page in your input tells you nothing about the document.
        Judge only from this page's own evidence: a page that shows only table
        rows, or is marked "Page 2 of 2", is a continuation page and must be
        "continue" even when you cannot see page 1. CRITICAL - consecutive
        documents of the same type: Output "start" whenever this page IS a first
        page (it carries the opening block), even when the preceding page has
        the same document type. Two copies of the same form filed back to back
        are two separate documents, and the first page of the second copy must
        be "start" so the two are not merged. PRECEDENCE: If the matched
        document type's description in <document-types> gives explicit boundary
        or page-ordering instructions (for example, how to handle pages scanned
        out of order), follow those instructions instead of the general rules
        above. If evidence is genuinely balanced, prefer "continue" for a page
        that lacks the opening block, and prefer "start" for a page that carries
        a complete opening block. </boundary-detection-rules>

        <output-format> {
          "classification_reason": "Detailed reasoning including specific visual and textual evidence that led to this classification, and which opening-block elements (title, issuer, addressee and address, date or period, account or reference number) this page does or does not carry",
          "class": "exact_document_type_from_list",
          "document_boundary": "start or continue"
        } </output-format>

        <<CACHEPOINT>>

        <document-ocr-data> {DOCUMENT_TEXT} </document-ocr-data>

        <final-instructions> Analyze the document above by: 1. Applying the
        <classification-instructions> to examine both visual and textual
        features 2. Selecting ONLY from document types in <document-types> 3.
        Providing clear reasoning with specific evidence 4. Outputting in the
        exact JSON format specified in <output-format> </final-instructions>
    packet:
      window_pages: '20'
      overlap_pages: '2'
      system_prompt: ''
      task_prompt: ''
    llm:
      model: us.anthropic.claude-sonnet-4-6
      model_lambda_hook_arn: null
      temperature: '0.0'
      top_p: '0.0'
      top_k: '5.0'
      reasoning_effort: medium
      max_tokens: null
      modality:
        text: null
        images: null
      image:
        target_width: null
        target_height: null
        dpi: null
        preprocessing: null
      validation:
        enforceValidClasses: true
        maxValidationRetries: '2'
      confidence:
        mode: topk
        top_k_candidates: '3'
        task_prompt_topk: >-
          <class-confidence> Your JSON object MUST also contain a "candidates"
          key: the {TOP_K_CANDIDATES} document types most likely to be correct
          for this page, most likely first, each with the probability that it is
          the correct type.

          "candidates": [
            {"class": "<most likely type>", "probability": <number between 0.0 and 1.0>},
            {"class": "<next most likely type>", "probability": <number between 0.0 and 1.0>}
          ]

          Rules: 1. Every "class" value must be one of the types listed in
          <document-types>. 2. The first candidate must be the same type you
          report in "class". 3. The probabilities must not sum to more than 1.0.
          Mass you leave unassigned means "possibly some other type". 4.
          Distribute the probability honestly. If a second type is genuinely
          plausible for this page, give it real probability mass instead of
          assigning close to 1.0 to the first — a page that is hard to classify
          should not look certain. </class-confidence>
        task_prompt_verbalized: >-
          <class-confidence> Your JSON object MUST also contain a "confidence"
          key: the probability, as a number between 0.0 and 1.0, that the type
          you report in "class" is correct for this page.

          Base it on how much better the page matches the type you chose than
          the other types in <document-types>. Do not default to a high value: a
          page whose evidence is thin or ambiguous should carry a low
          confidence. </class-confidence>
        task_prompt_topk_packet: ''
        task_prompt_verbalized_packet: ''
  split_then_classify:
    splitting:
      method: llm
      llm:
        model: us.anthropic.claude-sonnet-4-6
        model_lambda_hook_arn: null
        temperature: '0.0'
        top_p: '0.0'
        top_k: '5.0'
        reasoning_effort: medium
        max_tokens: null
        modality:
          text: null
          images: null
        image:
          target_width: null
          target_height: null
          dpi: null
          preprocessing: null
        granularity: page
        page:
          contextPagesCount: 0
          system_prompt: ''
          task_prompt: ''
        packet:
          window_pages: '20'
          overlap_pages: '2'
          system_prompt: ''
          task_prompt: ''
        boundary_hints: none
      boundary_model:
        backend: ''
        endpoint: ''
        input: images
        timeout_ms: '30000'
        max_concurrency: '4'
        price_per_request: '0.0'
    section_classification:
      method: llm
      pages: first_k
      k: '2'
      llm:
        model: us.anthropic.claude-sonnet-4-6
        model_lambda_hook_arn: null
        temperature: '0.0'
        top_p: '0.0'
        top_k: '5.0'
        reasoning_effort: medium
        max_tokens: null
        modality:
          text: null
          images: null
        image:
          target_width: null
          target_height: null
          dpi: null
          preprocessing: null
        validation:
          enforceValidClasses: true
          maxValidationRetries: '2'
        confidence:
          mode: topk
          top_k_candidates: '3'
          task_prompt_topk: >-
            <class-confidence> Your JSON object MUST also contain a "candidates"
            key: the {TOP_K_CANDIDATES} document types most likely to be correct
            for this page, most likely first, each with the probability that it
            is the correct type.

            "candidates": [
              {"class": "<most likely type>", "probability": <number between 0.0 and 1.0>},
              {"class": "<next most likely type>", "probability": <number between 0.0 and 1.0>}
            ]

            Rules: 1. Every "class" value must be one of the types listed in
            <document-types>. 2. The first candidate must be the same type you
            report in "class". 3. The probabilities must not sum to more than
            1.0. Mass you leave unassigned means "possibly some other type". 4.
            Distribute the probability honestly. If a second type is genuinely
            plausible for this page, give it real probability mass instead of
            assigning close to 1.0 to the first — a page that is hard to
            classify should not look certain. </class-confidence>
          task_prompt_verbalized: >-
            <class-confidence> Your JSON object MUST also contain a "confidence"
            key: the probability, as a number between 0.0 and 1.0, that the type
            you report in "class" is correct for this page.

            Base it on how much better the page matches the type you chose than
            the other types in <document-types>. Do not default to a high value:
            a page whose evidence is thin or ambiguous should carry a low
            confidence. </class-confidence>
          task_prompt_topk_packet: ''
          task_prompt_verbalized_packet: ''
        system_prompt: ''
        task_prompt: ''
      embeddings:
        model: ''
        min_similarity: '0.0'
      decision_model:
        backend: ''
        endpoint: ''
        input: images
        timeout_ms: '30000'
        max_concurrency: '4'
        price_per_request: '0.0'
        label_map: {}
        score_calibration: none
      low_confidence:
        min_confidence: '0.0'
        on_low_confidence: fallback_class
  document_shape:
    sectionSplitting: disabled
    maxPagesForClassification: ALL
extraction:
  postHook: []
  context_buffer: '0.3'
  model: us.anthropic.claude-sonnet-5
  prompt_cache: auto
  model_lambda_hook_arn: null
  row_shortfall_action: warn
  system_prompt: >-
    You are a document assistant. Respond only with JSON. Never make up data,
    only provide data found in the document being provided.
  task_prompt: >-
    <background> You are an expert in document analysis and information
    extraction.  You can understand and extract key information from documents
    classified as type: 

    {DOCUMENT_CLASS}. </background>

    <task> Your task is to take the unstructured text provided and convert it
    into a well-organized table format using JSON. Identify the main entities,
    attributes, or categories mentioned in the attributes list below and use
    them as keys in the JSON object.  Then, extract the relevant information
    from the text and populate the corresponding values in the JSON object.
    </task>

    <extraction-guidelines> Guidelines:
        1. Ensure that the data is accurately represented and properly formatted within
        the JSON structure
        2. Include double quotes around all keys and values
        3. Do not make up data - only extract information explicitly found in the
        document
        4. Do not use /n for new lines, use a space instead
        5. If a field is not found or if unsure, return null
        6. Format each value as directed by that attribute's description/format in the
        attributes section below. If an attribute specifies a date or number format,
        follow it EXACTLY; only if no format is specified, preserve the value as it
        appears in the document.
        7. Do not perform calculations or summations unless totals are explicitly given
        8. If an alias is not found in the document, return null
        9. Guidelines for checkboxes:
         9.A. CAREFULLY examine each checkbox, radio button, and selection field:
            - Look for marks like ✓, ✗, x, filled circles (●), darkened areas, or handwritten checks indicating selection
            - For checkboxes and multi-select fields, ONLY INCLUDE options that show clear visual evidence of selection
            - DO NOT list options that have no visible selection mark
         9.B. For ambiguous or overlapping tick marks:
            - If a mark overlaps between two or more checkboxes, determine which option contains the majority of the mark
            - Consider a checkbox selected if the mark is primarily inside the check box or over the option text
            - When a mark touches multiple options, analyze which option was most likely intended based on position and density. For handwritten checks, the mark typically flows from the selected checkbox outward.
            - Carefully analyze visual cues and contextual hints. Think from a human perspective, anticipate natural tendencies, and apply thoughtful reasoning to make the best possible judgment.
        10. Think step by step first and then answer.
    </extraction-guidelines>

    If the attributes section below contains a list of attribute names and
    descriptions, then output only those attributes, using the provided
    descriptions as guidance for finding the correct values. 

    <attributes> {ATTRIBUTE_NAMES_AND_DESCRIPTIONS} </attributes>

    <few-shot-examples> {FEW_SHOT_EXAMPLES} </few-shot-examples>

    <<CACHEPOINT>>

    <document-text> {DOCUMENT_TEXT} </document-text>

    <final-instructions> Extract key information from the document and return a
    JSON object with the following key steps: 1. Carefully analyze the document
    text to identify the requested attributes 2. Extract only information
    explicitly found in the document - never make up data 3. Format each value
    as directed by its attribute description/format (follow any specified
    date/number format EXACTLY; otherwise keep the document's rendering);
    replace newlines with spaces 4. For checkboxes, only include options with
    clear visual selection marks 5. Use null for any fields not found in the
    document 6. Ensure the output is properly formatted JSON with quoted keys
    and values 7. Think step by step before finalizing your answer
    </final-instructions>
  task_prompt_extraction_with_confidence: >-
    <background> You are an expert in document analysis and information
    extraction. You extract key information from documents classified as type:
    {DOCUMENT_CLASS}, and you also report your confidence in each extracted
    value. </background>

    <task> Convert the unstructured document into a well-organized JSON object
    using the attribute names below as keys, extracting the relevant values.
    Then record your confidence in each extracted value. </task>

    <extraction-guidelines> 1. Include double quotes around all keys and values
    2. Do not make up data - only extract information explicitly found in the
    document 3. Use a space instead of newlines 4. If a field is not found or
    you are unsure, return null 5. Format each value as directed by that
    attribute's description/format below.
       If an attribute specifies a date or number format, follow it EXACTLY; only if
       no format is specified, preserve the value as it appears in the document.
    6. Do not perform calculations unless totals are explicitly given 7.
    Carefully examine checkboxes/selection fields; only include options with
    clear
       visual selection marks
    8. Think step by step first, then answer </extraction-guidelines>

    <attributes> {ATTRIBUTE_NAMES_AND_DESCRIPTIONS} </attributes>

    <few-shot-examples> {FEW_SHOT_EXAMPLES} </few-shot-examples>

    <confidence-assessment> Record your confidence in EVERY extracted value,
    mirroring the extraction structure EXACTLY so there is one confidence entry
    per individual value. OUTPUT RULE (keep responses compact): include
    "confidence_reason" for a leaf ONLY when its confidence is below 0.9. For
    confidence >= 0.9, emit just {"confidence": <score>} with NO
    confidence_reason. When you do include one, keep it to at most 12 words and
    do not restate the extracted value. - Scalar field: {"confidence":
    <0.0-1.0>} (add "confidence_reason" only if < 0.9). - Group (nested object)
    field: an object with the SAME sub-keys as the value,
      each mapping to its own {"confidence": ...} leaf (add "confidence_reason" if < 0.9).
    - List field (e.g. a table): a LIST with ONE object per extracted row, in
    the
      SAME ORDER as the rows. Each row object MUST mirror that row's structure —
      i.e. the SAME column keys as the extracted row, and EACH column maps to its
      own {"confidence": ...} leaf (add "confidence_reason" only if < 0.9). Do NOT
      emit a single confidence for a whole row; score each cell. Nested lists follow
      the same rule recursively. Provide an entry for EVERY row and EVERY column —
      do not summarize or skip.
      Example — extracted row {"date": "...", "amount": "..."} ->
        {"date": {"confidence": 0.98},
         "amount": {"confidence": 0.72, "confidence_reason": "figure partly illegible"}}
    confidence = your calibrated certainty the value matches the source document
    (1.0 = certain, lower = ambiguous/illegible/inferred). HOW TO REPORT IT: -
    If an extraction_with_confidence or provide_field_assessment TOOL is
    available
      to you, use it: pass the extracted values and this field_assessment together in
      that ONE tool call. If you extracted in multiple steps (e.g. adding rows via
      patches), call it once at the very end so every row is assessed.
    - Otherwise (no such tool), return ONE JSON object with EXACTLY two
    top-level
      keys: "extraction" (the extracted values object described above) and
      "confidence" (the parallel confidence structure). Do NOT wrap it in any other
      key and do NOT add a "field_assessment" key. Shape:
        {"extraction": { ...extracted values... },
         "confidence":  { ...one confidence leaf per value, mirroring structure... }}
    Do NOT include bounding boxes unless explicitly instructed below — field
    locations are derived automatically from OCR. </confidence-assessment>

    <<CACHEPOINT>>

    <document-text> {DOCUMENT_TEXT} </document-text>
  task_prompt_extraction_with_confidence_topk: >-
    <background> You are an expert in document analysis and information
    extraction. You can understand and extract key information from documents
    classified as type: {DOCUMENT_CLASS}. </background> <task> Provide your 4
    best guesses and the probability that each is correct (0.0 to 1.0) for each
    attribute listed below. Give ONLY the guesses and probabilities, no other
    words or explanation.</task> <extraction-guidelines> Guidelines:
     1. Only consider values that are present in the provided document. Do not invent attribute values.
     2. Extract each entity candidate exactly how it is presented in the document. E.g. do not change "M" to "Monday"
     or change the date from "01/04" to "1/04".
     3. Format each value as directed by that attribute's description/format below.
       If an attribute specifies a date or number format, follow it EXACTLY; only if
       no format is specified, preserve the value as it appears in the document.
     4. For each extracted attribute key, the value MUST be a nested object formatted
     exactly like this:
            {
              "G1": "<1st most likely guess, copied EXACTLY as it appears in the document>",
              "P1": <probability between 0.0 and 1.0>,
              "G2": "<2nd most likely guess>",
              "P2": <probability between 0.0 and 1.0>,
              "G3": "<3rd most likely guess>",
              "P3": <probability between 0.0 and 1.0>,
              "G4": "<4th most likely guess>",
              "P4": <probability between 0.0 and 1.0>
            }
    </extraction-guidelines> If the attributes section below contains a list of
    attribute names and descriptions, then output only those attributes, using
    the provided descriptions as guidance for finding the correct values.
    <attributes> {ATTRIBUTE_NAMES_AND_DESCRIPTIONS} </attributes>
    <few-shot-examples> {FEW_SHOT_EXAMPLES} </few-shot-examples> <<CACHEPOINT>>
    <document-text> {DOCUMENT_TEXT} </document-text> <output-format> Give ONLY
    the JSON object containing the guesses and probabilities. Do not think
    step-by-step, do not show your work, and do not provide any reasoning,
    justifications, or extra commentary whatsoever.

    For SIMPLE attributes: {
      "simple_attribute_name": {
        "G1": "<1st most likely guess, copied EXACTLY as it appears in the document>",
        "P1": <probability between 0.0 and 1.0>,
        "G2": "<2nd most likely guess>",
        "P2": <probability between 0.0 and 1.0>,
        "G3": "<3rd most likely guess>",
        "P3": <probability between 0.0 and 1.0>,
        "G4": "<4th most likely guess>",
        "P4": <probability between 0.0 and 1.0>
      }
    }

    For LIST attributes, give G1/P1 ONLY (a single guess per cell) and include
    EVERY row that appears in the document. Completeness of the list matters
    more than alternative guesses, and extra guesses per cell multiply the
    output length by the number of rows: {
      "list_attribute_name": [
        {
          "item_attribute_1": { "G1": "<guess, copied EXACTLY as it appears in the document>", "P1": <probability between 0.0 and 1.0> },
          "item_attribute_2": { "G1": "<guess, copied EXACTLY as it appears in the document>", "P1": <probability between 0.0 and 1.0> }
        }
      ]
    } For GROUP attributes (a nested object), give one candidate object per
    sub-attribute: {
      "group_attribute_name": {
        "sub_attribute_1": {
          "G1": "<1st most likely guess, copied EXACTLY as it appears in the document>",
          "P1": <probability between 0.0 and 1.0>,
          "G2": "<2nd most likely guess>",
          "P2": <probability between 0.0 and 1.0>
        },
        "sub_attribute_2": {
          "G1": "<1st most likely guess, copied EXACTLY as it appears in the document>",
          "P1": <probability between 0.0 and 1.0>
        }
      }
    } </output-format>
  temperature: '0.0'
  top_p: '0.0'
  top_k: '5.0'
  reasoning_effort: low
  image:
    target_width: null
    target_height: null
    dpi: null
    preprocessing: null
  mode: simple
  agentic:
    enabled: false
    integrated_confidence_strategy: two_step
    restate_schema_in_system_prompt: true
    review_agent: false
    review_agent_model: us.anthropic.claude-sonnet-5
    max_concurrent_batches: '10'
    shard_token_budget: 0
    max_pages_per_shard: '5'
    max_images_per_agent: '20'
    table_parsing:
      enabled: true
      min_confidence_threshold: '95.0'
      min_parse_success_rate: '0.9'
      use_confidence_data: true
      max_empty_line_gap: '3'
      auto_merge_adjacent_tables: true
      lazy_images: true
    runtime: step_functions
  confidence:
    mode: separate
    enabled: true
    model: us.amazon.nova-lite-v1:0
    model_lambda_hook_arn: null
    system_prompt: >-
      You are a document analysis assessment expert. Your role is to evaluate
      the confidence and accuracy of data extraction results by analyzing them
      against source documents. Provide accurate confidence scores for each
      assessment. When bounding boxes are requested, provide precise coordinate
      locations where information appears in the document.
    task_prompt: >-
      <background> You are an expert document analysis assessment system. Your
      task is to evaluate the confidence of extraction results for a document of
      class {DOCUMENT_CLASS}. </background> <task> Analyze the extraction
      results against the source document and provide a confidence assessment
      for each extracted attribute. Consider factors such as: 1. Text clarity
      and OCR quality in the source regions 2. Alignment between extracted
      values and document content 3. Presence of clear evidence supporting the
      extraction 4. Potential ambiguity or uncertainty in the source material 5.
      Completeness and accuracy of the extracted information </task>
      <assessment-guidelines> For each attribute, provide: - A confidence score
      between 0.0 and 1.0 (1.0 = clear, unambiguous evidence;
        lower = weaker/ambiguous evidence)
      - A confidence_reason ONLY when the confidence is below 0.9 (see the
      output
        rule below). Reasons exist to explain low/uncertain scores for human review;
        a high-confidence value does not need one.
      Base assessments on actual document content and OCR quality; account for
      OCR confidence scores when provided; be objective and specific.
      </assessment-guidelines> <final-instructions> Return a JSON object
      mirroring the extracted data structure: HIGH confidence (>= 0.9): 
      {"attr": {"confidence": 0.97}} LOWER confidence (< 0.9):  {"attr":
      {"confidence": 0.72, "confidence_reason": "..."}} GROUP:   {"grp":
      {"sub1": {"confidence": 0.95}}} LIST:    {"items": [ {"c1": {"confidence":
      0.72, "confidence_reason": "..."}}, ... ]} OUTPUT RULE (keep responses
      compact — omit reasons for confident values): - Emit "confidence_reason"
      for a leaf ONLY when its confidence is below 0.9.
        For confidence >= 0.9, emit just {"confidence": <score>} with NO
        confidence_reason key.
      - When you do include a confidence_reason, keep it to at most 12 words and
      do
        not restate the extracted value.
      IMPORTANT: - For LIST attributes, assess EACH row separately (one object
      per row, in order),
        and within each row give EACH column its own confidence leaf ({"confidence"},
        plus "confidence_reason" only when below 0.9) — mirror the row's column keys;
        do NOT emit a single confidence per row. Nested lists follow the same rule
        recursively.
      - Include a confidence assessment for ALL attributes present in the
